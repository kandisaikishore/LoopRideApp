name: Repository Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Java tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then
            mvn --batch-mode test
          elif [ -x ./gradlew ]; then
            ./gradlew test
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Gradle build file exists but Gradle wrapper is missing; install Gradle explicitly or add the wrapper." >&2
            exit 1
          elif find . -type d \( -name .git -o -name node_modules -o -name target \) -prune -o -type f -name '*.java' -print -quit | grep -q .; then
            mkdir -p /tmp/java-classes
            mapfile -d '' java_files < <(find . -type d \( -name .git -o -name node_modules -o -name target \) -prune -o -type f -name '*.java' -print0)
            javac -Xlint:all -d /tmp/java-classes "${java_files[@]}"
            echo "Plain Java source compilation passed."
          else
            echo "No Java source or build manifest found; skipping Java checks."
          fi
      - name: Python tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if find . -type d \( -name .git -o -name node_modules -o -name .venv -o -name __pycache__ \) -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pip install pytest
            pytest -q
          else
            echo "No Python test files found; skipping pytest instead of failing with exit code 5."
            if find . -type d \( -name .git -o -name node_modules -o -name .venv -o -name __pycache__ \) -prune -o -type f -name '*.py' -print -quit | grep -q .; then
              python -m compileall -q .
              echo "Python syntax compilation passed."
            fi
          fi
      - name: Node tests and build
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test --if-present
            npm run build --if-present
          else
            echo "No root package.json found; skipping Node checks."
          fi
