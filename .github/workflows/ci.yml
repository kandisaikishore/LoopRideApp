name: RoutePulse CI
on:
  push:
    branches: [main, routepulse-ai]
  pull_request:
    branches: [main, routepulse-ai]
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit and component tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
