name: LoopRideApp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile application
        run: |
          set -eu
          javac -Xlint:all -d . LoopRideApp.java
          test -f project/LoopRideApp.class
      - name: Start application
        run: |
          set -eu
          java project.LoopRideApp 18080 > server.log 2>&1 &
          echo $! > server.pid
          ready=0
          for i in {1..20}; do
            if curl --silent --show-error --fail http://127.0.0.1:18080/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat server.log; exit 1; fi
      - name: Test HTTP routes and methods
        run: |
          set -eu
          base=http://127.0.0.1:18080
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          assert_status() {
            expected="$1"; shift
            actual="$(curl --silent --show-error -o "$tmp/body" -D "$tmp/headers" -w '%{http_code}' "$@")"
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected but received $actual for $*"
              cat "$tmp/body"
              exit 1
            fi
          }
          assert_status 200 "$base/"
          if ! grep -qi 'Content-Type: text/html' "$tmp/headers"; then echo "root missing HTML content type"; cat "$tmp/headers"; exit 1; fi
          if ! grep -q 'Rider App' "$tmp/body"; then echo "root body marker missing"; head -c 300 "$tmp/body"; exit 1; fi
          assert_status 200 "$base/index.html"
          if ! grep -q 'Driver dashboard' "$tmp/body"; then echo "index.html dashboard marker missing"; head -c 300 "$tmp/body"; exit 1; fi
          assert_status 200 "$base/api/health"
          if ! grep -qi 'Content-Type: application/json' "$tmp/headers"; then echo "health missing JSON content type"; cat "$tmp/headers"; exit 1; fi
          if ! grep -q '"status": "UP"' "$tmp/body"; then echo "health status marker missing"; cat "$tmp/body"; exit 1; fi
          assert_status 200 "$base/api/rider"
          if ! grep -q '"role": "rider"' "$tmp/body"; then echo "rider payload mismatch"; cat "$tmp/body"; exit 1; fi
          assert_status 200 "$base/api/driver"
          if ! grep -q '"role": "driver"' "$tmp/body"; then echo "driver payload mismatch"; cat "$tmp/body"; exit 1; fi
          assert_status 404 "$base/api/does-not-exist"
          if ! grep -qi 'endpoint not found' "$tmp/body"; then echo "unknown API JSON mismatch"; cat "$tmp/body"; exit 1; fi
          assert_status 404 "$base/unknown-page"
          if ! grep -qi 'endpoint not found' "$tmp/body"; then echo "unknown page JSON mismatch"; cat "$tmp/body"; exit 1; fi
      - name: Stop application
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
          cat server.log || true

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and browser
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Compile and start app
        run: |
          set -eu
          javac -d . LoopRideApp.java
          java project.LoopRideApp 18080 > server.log 2>&1 &
          echo $! > server.pid
          ready=0
          for i in {1..20}; do
            if curl --silent --show-error --fail http://127.0.0.1:18080/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat server.log; exit 1; fi
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Stop app
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
          cat server.log || true

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag loop-ride-app:test .
      - name: Run container and test endpoints
        run: |
          set -eu
          docker run --detach --rm --init --name loop-ride-app-test -p 18081:10000 loop-ride-app:test
          cleanup() {
            docker logs loop-ride-app-test || true
            docker stop --time 5 loop-ride-app-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for i in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:18081/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs loop-ride-app-test; exit 1; fi
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/not-found)"
          test "$status" = "404"
          health="$(curl --silent --show-error http://127.0.0.1:18081/api/health)"
          echo "$health"
          echo "$health" | grep -q '"status":"UP"'
